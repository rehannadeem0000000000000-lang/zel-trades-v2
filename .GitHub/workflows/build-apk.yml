name: Build Zel Trades APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Node dependencies
        run: npm install

      - name: Build APK
        working-directory: android
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.14.3/bin:$PATH
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Show built APK
        run: |
          find android/app/build/outputs -name "*.apk" -type f -exec ls -lh {} \;
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zel-trades-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
