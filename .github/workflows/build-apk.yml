name: Build Zel Trades APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - run: npm install
      - working-directory: android
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.14.3/bin:$PATH
          gradle :app:assembleDebug --no-daemon
      - run: find android/app/build/outputs -name "*.apk" -exec ls -lh {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: zel-trades-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
